[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-loop"
description = "Project-scoped evidence workflows and receipt validation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
dynamic = ["version"]

[project.scripts]
proofloop = "proofloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "proofloop.core.VERSION"}
